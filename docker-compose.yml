services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pairance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pairance
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the full schema (incl. user_sessions + plaid tables) on first boot
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pairance -d pairance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    environment:
      DATABASE_URL: postgres://pairance:${POSTGRES_PASSWORD}@db:5432/pairance
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:?set PLAID_CLIENT_ID in .env}
      PLAID_SECRET: ${PLAID_SECRET:?set PLAID_SECRET in .env}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      # Set to "true" ONLY if you serve the app over HTTPS (e.g. behind a reverse proxy):
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # First-boot account seed (only used when the users table is empty):
      SEED_EMAIL: ${SEED_EMAIL:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      SEED_NAME: ${SEED_NAME:-}
      # Only needed if you use the AI budget suggestions feature outside Replit:
      AI_INTEGRATIONS_OPENAI_API_KEY: ${AI_INTEGRATIONS_OPENAI_API_KEY:-}
      AI_INTEGRATIONS_OPENAI_BASE_URL: ${AI_INTEGRATIONS_OPENAI_BASE_URL:-}
      NODE_ENV: production
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: artifacts/budget-tracker/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  pgdata:

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary -->
    <title>Pairance — Better money, together.</title>
    <meta name="description" content="Pairance helps couples track shared spending, set budgets, and build goals — together." />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="Pairance" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Theme colour (Chrome, Android, Samsung) -->
    <meta name="theme-color" content="#182235" />
    <meta name="msapplication-TileColor" content="#182235" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />

    <!-- Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pairance" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pairance — Better money, together." />
    <meta property="og:description" content="Couples budgeting for shared goals and everyday clarity." />
    <meta property="og:image" content="/icon-512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pairance — Better money, together." />
    <meta name="twitter:description" content="Couples budgeting for shared goals and everyday clarity." />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts: Outfit (display + amounts) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
